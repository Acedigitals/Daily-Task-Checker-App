<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Daily Task Checker</h1>

    <details id="defaultSettings">
        <summary>Edit default tasks</summary>
        <input type="text" id="defaultTaskInput" placeholder="Add a default task">
        <button id="addDefaultButton">Add</button>
        <ul id="defaultTaskList"></ul>
    </details>

    <input type="text" id="taskInput" placeholder="Enter a task">
    <button id="addButton">Add</button>
    <ul id="taskList"></ul>
    <p id="progress"></p>

    <script src="script.js"></script>

</body>
</html>
